status: optional_nonblocking_but_explicit
purpose: predeclared lightweight MOF-level consequence screen

candidate_properties:
  - density
  - pld
  - lcd
  - volume
  - natoms

predeclared_stratification_pairs:
  - {label_column: polarity, property: density}
  - {label_column: charge_present, property: density}
  - {label_column: aromaticity, property: pld}
  - {label_column: aromaticity, property: lcd}
  - {label_column: macrocycle_gt6_rings, property: pld}
  - {label_column: macrocycle_gt6_rings, property: lcd}

incremental_prediction:
  preferred_target: density
  candidate_baseline_features: [pld, lcd, volume, natoms]
  augmented_with: ten_frozen_linker_proxy_labels
  model: ridge
  validation_alphas: [0.1, 1.0, 10.0]
  selection_metric: validation_mae

inclusion_rule:
  - chemically_interpretable
  - adequate_support
  - duplicate_aware
  - nontrivial
