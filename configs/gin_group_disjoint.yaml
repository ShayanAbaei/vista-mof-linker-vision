run:
  experiment_name: gin_groupdisjoint
  tuning_seed: 42
data:
  manifest: data/frozen/canonical_group_disjoint_split.csv
  require_canonical_disjoint: true
model:
  family: GIN
  node_features:
  - atomic_number_scaled
  - degree_scaled
  - formal_charge_scaled
  - total_H_scaled
  - aromatic
  - in_ring
  - atomic_mass_scaled
  - hybridization_onehot
  - chirality_onehot
  implementation: edge-aware GIN family (PyG GINEConv)
  bond_features:
  - bond_type
  - conjugated
  - in_ring
  - stereochemistry
tuning_grid:
  n_layers:
  - 3
  - 5
  hidden_dim:
  - 128
  - 256
  dropout:
  - 0.1
  - 0.3
  learning_rate:
  - 0.001
  - 0.0003
training:
  epochs: 100
  patience: 15
  batch_size: 64
  num_workers: 0
  weight_decay: 1.0e-05
  selection_metric: macro_auprc
evaluation:
  threshold_source: validation
  threshold_objective: f1
  threshold_grid_points: 200
final_seeds:
- 17
- 42
- 123
loss:
  type: frequency_adapted_asl
  frequencies_from: train
  same_family_as_vista: true
